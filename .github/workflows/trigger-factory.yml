name: AI Content Factory Scheduler

on:
  schedule:
    # Check the Asia/Kolkata schedule every 5 minutes; the server decides whether a slot is due.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ai-content-factory-scheduler
  cancel-in-progress: false

jobs:
  trigger-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secret
        env:
          ACF_CRON_SECRET: ${{ secrets.ACF_CRON_SECRET }}
        run: |
          if [ -z "$ACF_CRON_SECRET" ]; then
            echo "::error::Repository secret ACF_CRON_SECRET is missing. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Trigger scheduled factory
        env:
          ACF_CRON_SECRET: ${{ secrets.ACF_CRON_SECRET }}
        run: |
          set -eu
          code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --max-time 180 \
            --header "Authorization: Bearer $ACF_CRON_SECRET" \
            "https://ai-content-factory-zeta-ruby.vercel.app/api/cron/factory")
          cat response.json
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Factory endpoint returned HTTP $code"
            exit 1
          fi
