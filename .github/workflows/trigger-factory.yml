name: AI Content Factory Scheduler - Manual Fallback

on:
  workflow_dispatch:

concurrency:
  group: ai-content-factory-scheduler
  cancel-in-progress: false

jobs:
  trigger-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check required secret
        env:
          ACF_CRON_SECRET: ${{ secrets.ACF_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${ACF_CRON_SECRET:-}" ]; then
            echo "::error title=Missing scheduler secret::Repository secret ACF_CRON_SECRET is missing. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Trigger production factory
        env:
          ACF_CRON_SECRET: ${{ secrets.ACF_CRON_SECRET }}
          FACTORY_URL: "https://ai-content-factory-swrang120.vercel.app"
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 240 \
            --header "Authorization: Bearer ${ACF_CRON_SECRET}" \
            --header "Accept: application/json" \
            "${FACTORY_URL}/api/cron/factory")"
          echo "${response}"
