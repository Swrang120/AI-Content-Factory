name: AI Content Factory - YouTube Live Worker

on:
  # Manual dashboard Start/Stop only; automatic live polling is disabled.
  workflow_dispatch:

concurrency:
  group: acf-youtube-live-worker
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Prepare FFmpeg (fast path)
        run: |
          # GitHub-hosted Ubuntu images commonly include FFmpeg already.
          # Avoid a slow apt index refresh when the binary is available.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            # Bound package-manager waits so a slow mirror cannot leave the live
            # worker stuck forever before it even claims the queued broadcast.
            sudo timeout 90s apt-get update -qq \
              -o Acquire::Retries=0 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 || true
            # The Ubuntu mirror was too slow for the old 120s limit, so the
            # worker failed before it could claim the already-created broadcast.
            # Give apt a bounded but realistic download window and retry transient
            # mirror/network failures rather than leaving YouTube stuck at Upcoming.
            sudo timeout 600s apt-get install -y --no-install-recommends ffmpeg \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60
          fi
          command -v ffmpeg
          ffmpeg -version | head -n 1

      - name: Claim live job and stream for up to five hours
        env:
          ACF_FACTORY_URL: "https://ai-content-factory-zeta-ruby.vercel.app"
          LIVE_WORKER_TOKEN: ${{ secrets.ACF_CRON_SECRET || secrets.LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACF_FACTORY_URL:-}" || { echo "::error::Production Vercel URL is set in this workflow."; exit 1; }
          test -n "${LIVE_WORKER_TOKEN:-}" || { echo "::error::Add repository secret ACF_CRON_SECRET in GitHub Actions and Vercel."; exit 1; }
          BASE="${ACF_FACTORY_URL%/}"
          CLAIM=""
          # This workflow runs only when manually dispatched by the dashboard.
          CLAIM="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" \
            "${BASE}/api/live/worker/claim")"
          JOB="$(printf '%s' "$CLAIM" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("yes" if d.get("job") else "no")')"
          JOB_ID="$(printf '%s' "$CLAIM" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("job") or {}).get("id",""))')"
          if [ "$JOB" != "yes" ] || [ -z "$JOB_ID" ]; then
            echo "No manual live session is ready; exiting normally."
            exit 0
          fi
          export CLAIM BASE JOB_ID
          python3 - <<'PY'
          import json, os, datetime, time
          d=json.loads(os.environ["CLAIM"])["job"]
          start=datetime.datetime.fromisoformat(d["scheduledStartTime"].replace("Z","+00:00")).timestamp()
          wait=max(0,int(start-time.time()))
          print(f"Claimed live job {d.get('id')} — {d.get('title')}; waiting {wait}s for scheduled start.")
          time.sleep(wait)
          with open("live-job.json","w",encoding="utf-8") as f: json.dump(d,f)
          PY
          # Stop may be pressed while this worker is sleeping until scheduledStartTime.
          # Re-check the authoritative job state before opening FFmpeg/YouTube RTMP.
          STATE_AFTER_WAIT="$(curl --silent --show-error --max-time 15 \
            -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" \
            "${BASE}/api/live/worker/status?id=${JOB_ID}" || true)"
          export STATE_AFTER_WAIT
          set +e
          python3 - <<'PY'
          import json, os, sys
          try:
              d=json.loads(os.environ.get("STATE_AFTER_WAIT","{}"))
              job=d.get("job") or {}
              status=str(job.get("status",""))
              stopped=bool(d.get("stopRequested") or job.get("stopRequested"))
              if status in ("completed","error","stopping") or stopped:
                  print(f"Live job {os.environ.get('JOB_ID')} was cancelled before streaming (status={status}, stopRequested={stopped}); exiting without starting FFmpeg.")
                  sys.exit(42)
          except Exception as exc:
              print("Could not verify live state after scheduled wait: "+str(exc), file=sys.stderr)
              sys.exit(1)
          PY
          CHECK_EXIT=$?
          set -e
          if [ "$CHECK_EXIT" -eq 42 ]; then exit 0; fi
          if [ "$CHECK_EXIT" -ne 0 ]; then
            echo "::error::Could not verify the live job state after waiting; refusing to start the stream."
            exit 1
          fi
          MEDIA_URL="$(python3 -c 'import json; print(json.load(open("live-job.json"))["mediaUrl"])')"
          MEDIA_TYPE="$(python3 -c 'import json; print(json.load(open("live-job.json")).get("mediaType","video"))')"
          RTMP_URL="$(python3 -c 'import json; j=json.load(open("live-job.json")); print(j["rtmpUrl"])')"
          if [ "$MEDIA_TYPE" != "car_animation" ]; then
            test -n "$MEDIA_URL" || { echo "::error::Live job has no media URL."; exit 1; }
          fi
          test -n "$RTMP_URL" || { echo "::error::YouTube RTMP URL is missing."; exit 1; }

          # Google Drive's public-looking uc?export=download URL can return an HTML
          # consent/permission page to FFmpeg. For a Drive file, download the real
          # bytes through the Drive API using a short-lived server-side OAuth token.
          if [ "$MEDIA_TYPE" = "video" ] && [[ "$MEDIA_URL" == *"drive.google.com/"* ]]; then
            DRIVE_FILE_ID="$(python3 - "$MEDIA_URL" <<'PY'
          import sys, urllib.parse, re
          u=urllib.parse.urlparse(sys.argv[1])
          q=urllib.parse.parse_qs(u.query)
          fid=(q.get("id") or [""])[0]
          if not fid:
              m=re.search(r"/file/d/([^/]+)",u.path)
              fid=m.group(1) if m else ""
          if not re.fullmatch(r"[A-Za-z0-9_-]{10,}",fid):
              raise SystemExit("Could not extract Google Drive file ID from selected video URL.")
          print(fid)
          PY
          )"
            TOKEN_RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 30 \
              -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" \
              "${BASE}/api/live/worker/drive-token")"
            DRIVE_ACCESS_TOKEN="$(printf '%s' "$TOKEN_RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("accessToken",""))')"
            test -n "$DRIVE_ACCESS_TOKEN" || { echo "::error::Google Drive OAuth token unavailable; reconnect Drive in the dashboard."; exit 1; }
            echo "Downloading selected Google Drive video through authenticated Drive API (file ID hidden)."
            curl --fail-with-body --silent --show-error --location --max-time 240 \
              -H "Authorization: Bearer ${DRIVE_ACCESS_TOKEN}" \
              "https://www.googleapis.com/drive/v3/files/${DRIVE_FILE_ID}?alt=media" \
              -o live-source-video
            unset DRIVE_ACCESS_TOKEN TOKEN_RESPONSE
            test -s live-source-video || { echo "::error::Google Drive download returned an empty file."; exit 1; }
            VIDEO_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 live-source-video 2>/dev/null || true)"
            if [ -z "$VIDEO_DURATION" ]; then
              echo "::error::Google Drive response is not a playable video file. Check Drive access and the selected file format."
              file live-source-video || true
              exit 1
            fi
            echo "Selected Drive video downloaded and validated (duration ${VIDEO_DURATION}s)."
            MEDIA_URL="live-source-video"
          fi

          if [ "$MEDIA_TYPE" = "car_animation" ]; then
            # Built-in free cartoon-driving scene. This is an animated scene, not an interactive game capture.
            setsid ffmpeg -hide_banner -loglevel warning -re \
              -f lavfi -i "color=c=0x8bd3ff:s=1280x720:r=30" \
              -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
              -filter_complex "[0:v]drawbox=x=0:y=300:w=1280:h=230:color=0x68b85b:t=fill,drawbox=x=0:y=520:w=1280:h=200:color=0x454b55:t=fill,drawbox=x=0:y=620:w=1280:h=8:color=white:t=fill,drawbox=x=mod(t*180\\,1500)-240:y=555:w=210:h=62:color=0xffc928:t=fill,drawbox=x=mod(t*180\\,1500)-190:y=520:w=120:h=42:color=0x2878d0:t=fill,drawbox=x=mod(t*180\\,1500)-205:y=610:w=42:h=42:color=0x202020:t=fill,drawbox=x=mod(t*180\\,1500)-105:y=610:w=42:h=42:color=0x202020:t=fill,drawbox=x=0:y=0:w=1280:h=105:color=0x101827@0.82:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='CARTOON CAR DRIVE LIVE':fontcolor=white:fontsize=42:x=(w-text_w)/2:y=28,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='AI Content Factory':fontcolor=0xffd76b:fontsize=24:x=(w-text_w)/2:y=76,format=yuv420p[v]" \
              -map "[v]" -map 1:a -t 18000 -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 30 -g 60 -c:a aac -b:a 128k -ar 44100 -f flv "$RTMP_URL" &
          elif [ "$MEDIA_TYPE" = "playlist" ]; then
            # Download the selected public Drive videos and play them in filename order, then repeat the full playlist.
            python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, urllib.error, os, re, shutil
          job=json.load(open("live-job.json",encoding="utf-8"))
          items=job.get("mediaPlaylist") or []
          if not items:
              raise SystemExit("Playlist job contains no videos.")
          token_req=urllib.request.Request(os.environ["BASE"]+"/api/live/worker/drive-token",headers={"x-live-worker-token":os.environ["LIVE_WORKER_TOKEN"]})
          with urllib.request.urlopen(token_req,timeout=30) as response:
              token_data=json.load(response)
          access_token=token_data.get("accessToken","")
          if not token_data.get("ok") or not access_token:
              raise SystemExit("Google Drive OAuth token unavailable. Reconnect Drive in the dashboard.")
          folder=pathlib.Path("drive-playlist")
          folder.mkdir(exist_ok=True)
          lines=[]
          def get_file_id(raw):
              parsed=urllib.parse.urlparse(raw)
              query=urllib.parse.parse_qs(parsed.query)
              fid=(query.get("id") or [""])[0]
              if not fid:
                  match=re.search(r"/file/d/([^/]+)",parsed.path)
                  if match: fid=match.group(1)
              return fid if re.fullmatch(r"[A-Za-z0-9_-]{10,}",fid or "") else ""
          def download_drive(raw,target):
              fid=get_file_id(raw)
              if not fid:
                  raise ValueError("Invalid Google Drive file URL")
              url="https://www.googleapis.com/drive/v3/files/"+urllib.parse.quote(fid,safe="")+"?alt=media"
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+access_token,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=240) as response:
                  content_type=response.headers.get("Content-Type","").lower()
                  if "text/html" in content_type or "application/json" in content_type:
                      raise ValueError("Drive API returned a permission/error document, not video bytes")
                  with target.open("wb") as output:
                      shutil.copyfileobj(response,output,1024*1024)
              if target.stat().st_size<1024:
                  raise ValueError("Drive download was empty or too small to be a video")
          for index,item in enumerate(items,1):
              name=str(item.get("name") or f"video {index}")
              url=item.get("url") or ""
              target=(folder/f"{index:03d}.video").resolve()
              try:
                  download_drive(url,target)
                  lines.append("file '"+str(target).replace("'","'\\''")+"'")
                  print(f"Downloaded and validated bytes {index}/{len(items)}: {name} ({target.stat().st_size} bytes)")
              except Exception as exc:
                  target.unlink(missing_ok=True)
                  print(f"Skipping {name}: authenticated Drive download failed ({type(exc).__name__}: {exc})")
          if not lines:
              raise SystemExit("No selected playlist videos could be downloaded from Google Drive. Reconnect Drive and verify access.")
          pathlib.Path("drive-playlist.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
            setsid ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -f concat -safe 0 -i drive-playlist.txt \
              -t 18000 -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 30 -g 60 \
              -c:a aac -b:a 128k -ar 44100 -f flv "$RTMP_URL" &
          elif [ "$MEDIA_TYPE" = "audio" ]; then
            setsid ffmpeg -hide_banner -loglevel warning \
              -re -f lavfi -i "color=c=0x101827:s=1920x1080:r=30" \
              -stream_loop -1 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -i "$MEDIA_URL" \
              -t 18000 -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='AI CONTENT FACTORY LIVE':fontcolor=white:fontsize=54:x=(w-text_w)/2:y=h*0.40,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Original / authorized music':fontcolor=0xD8B45A:fontsize=34:x=(w-text_w)/2:y=h*0.50" \
              -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 30 -g 60 \
              -c:a aac -b:a 128k -ar 44100 -f flv "$RTMP_URL" &
          else
            setsid ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i "$MEDIA_URL" \
              -t 18000 -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 30 -g 60 \
              -c:a aac -b:a 128k -ar 44100 -f flv "$RTMP_URL" &
          fi
          FFMPEG_PID=$!
          sleep 20
          # A Stop click during encoder warm-up must cancel before we mark YouTube Live.
          BOOT_STATE="$(curl --silent --show-error --max-time 15 \
            -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" \
            "${BASE}/api/live/worker/status?id=${JOB_ID}" || true)"
          BOOT_STOP="$(printf '%s' "$BOOT_STATE" | python3 -c 'import json,sys; d=json.load(sys.stdin); j=d.get("job") or {}; print("true" if d.get("stopRequested") or j.get("stopRequested") or j.get("status")=="stopping" else "false")' 2>/dev/null || echo false)"
          if [ "$BOOT_STOP" = "true" ]; then
            echo "Stop requested during startup; terminating encoder before YouTube start."
            kill -INT -- "-$FFMPEG_PID" 2>/dev/null || kill -INT "$FFMPEG_PID" 2>/dev/null || true
            sleep 2
            kill -TERM -- "-$FFMPEG_PID" 2>/dev/null || kill -TERM "$FFMPEG_PID" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$FFMPEG_PID" 2>/dev/null || kill -KILL "$FFMPEG_PID" 2>/dev/null || true
            wait "$FFMPEG_PID" 2>/dev/null || true
            curl --fail-with-body --silent --show-error --max-time 30 -X POST \
              -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"id\":\"$JOB_ID\"}" "${BASE}/api/live/worker/finish" || true
            exit 0
          fi
          if ! kill -0 "$FFMPEG_PID" 2>/dev/null; then
            wait "$FFMPEG_PID" || true
            curl --silent --show-error --max-time 30 -X POST \
              -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"id\":\"$JOB_ID\",\"error\":\"FFmpeg exited before stream startup\"}" \
              "${BASE}/api/live/worker/error" || true
            exit 1
          fi
          # YouTube may take several seconds to recognize the incoming RTMP feed.
          # Capture the response and mark the job as error if startup fails, instead of
          # leaving the dashboard stuck forever at worker_claimed.
          START_RESPONSE="$(curl --silent --show-error --max-time 90 -X POST \
            -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"id\":\"$JOB_ID\"}" -w 'HTTP_STATUS:%{http_code}' "${BASE}/api/live/worker/start" || true)"
          printf '%s\\n' "$START_RESPONSE"
          if ! printf '%s' "$START_RESPONSE" | grep -q '"ok":true'; then
            python3 - "$JOB_ID" "$START_RESPONSE" <<'PY' > worker-start-error.json
          import json,sys
          print(json.dumps({"id":sys.argv[1],"error":"Live startup failed: "+sys.argv[2][-1200:]}))
          PY
            curl --silent --show-error --max-time 30 -X POST \
              -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
              --data-binary @worker-start-error.json "${BASE}/api/live/worker/error" || true
            echo "::error::YouTube did not confirm live startup; job marked as error."
            exit 1
          fi
          # Poll the dashboard stop request while FFmpeg is streaming.
          STOP_REQUESTED="false"
          while kill -0 "$FFMPEG_PID" 2>/dev/null; do
            STATE="$(curl --silent --show-error --max-time 15 \
              -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" \
              "${BASE}/api/live/worker/status?id=${JOB_ID}" || true)"
            STOP_REQUESTED="$(printf '%s' "$STATE" | python3 -c 'import json,sys; 
          try: print("true" if json.load(sys.stdin).get("stopRequested") else "false")
          except Exception: print("false")')"
            if [ "$STOP_REQUESTED" = "true" ]; then
              echo "Manual stop requested; stopping FFmpeg."
              # Try graceful shutdown, then force termination if FFmpeg hangs.
              kill -INT -- "-$FFMPEG_PID" 2>/dev/null || kill -INT "$FFMPEG_PID" 2>/dev/null || true
              for attempt in $(seq 1 10); do
                kill -0 "$FFMPEG_PID" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$FFMPEG_PID" 2>/dev/null; then
                echo "FFmpeg did not exit after SIGINT; sending SIGTERM."
                kill -TERM -- "-$FFMPEG_PID" 2>/dev/null || kill -TERM "$FFMPEG_PID" 2>/dev/null || true
                sleep 3
              fi
              if kill -0 "$FFMPEG_PID" 2>/dev/null; then
                echo "FFmpeg still running; sending SIGKILL."
                kill -KILL -- "-$FFMPEG_PID" 2>/dev/null || kill -KILL "$FFMPEG_PID" 2>/dev/null || true
              fi
              break
            fi
            sleep 10
          done
          set +e
          wait "$FFMPEG_PID"
          STREAM_EXIT=$?
          set -e
          if [ "$STOP_REQUESTED" = "true" ]; then STREAM_EXIT=0; fi
          if [ "$STREAM_EXIT" -ne 0 ]; then
            curl --silent --show-error --max-time 30 -X POST \
              -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"id\":\"$JOB_ID\",\"error\":\"FFmpeg stream exited with code $STREAM_EXIT\"}" \
              "${BASE}/api/live/worker/error" || true
            exit "$STREAM_EXIT"
          fi
          curl --fail-with-body --silent --show-error --max-time 30 -X POST \
            -H "x-live-worker-token: ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"id\":\"$JOB_ID\"}" "${BASE}/api/live/worker/finish"
