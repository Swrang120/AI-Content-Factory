name: AI Content Factory CI

on:
  push:
    branches: [production-factory-upgrade]
  pull_request:
    branches: [main, production-factory-upgrade]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
