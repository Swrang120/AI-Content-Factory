name: AI Content Factory Worker

on:
  schedule:
    - cron: "7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

concurrency:
  group: ai-content-factory-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Process scheduled production job
        env:
          FACTORY_URL: "https://ai-content-factory-zeta-ruby.vercel.app"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --retry-delay 5             -H "Authorization: Bearer $CRON_SECRET"             "$FACTORY_URL/api/cron/factory"
      - name: Capture analytics snapshot
        if: ${{ success() }}
        env:
          FACTORY_URL: "https://ai-content-factory-zeta-ruby.vercel.app"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --retry 2 --retry-delay 5             -H "Authorization: Bearer $CRON_SECRET"             "$FACTORY_URL/api/cron/analytics" || true
