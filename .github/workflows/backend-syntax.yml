name: Backend Syntax Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server syntax
        run: node --check server.js
      - name: Check Vercel entry syntax
        run: node --check api/index.js
