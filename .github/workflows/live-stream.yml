name: AI Content Factory Live Worker

on:
  workflow_dispatch:
  schedule:
    # Check for a manually requested live session every five minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: acf-live-worker
  cancel-in-progress: false

jobs:
  live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate secrets
        env:
          ACF_BASE_URL: ${{ secrets.ACF_BASE_URL }}
          LIVE_WORKER_TOKEN: ${{ secrets.LIVE_WORKER_TOKEN }}
        run: |
          test -n "$ACF_BASE_URL" || (echo "Missing GitHub Actions secret ACF_BASE_URL" && exit 1)
          test -n "$LIVE_WORKER_TOKEN" || (echo "Missing GitHub Actions secret LIVE_WORKER_TOKEN" && exit 1)
      - name: Claim and run live session if requested
        env:
          ACF_BASE_URL: ${{ secrets.ACF_BASE_URL }}
          LIVE_WORKER_TOKEN: ${{ secrets.LIVE_WORKER_TOKEN }}
          LIVE_MAX_MINUTES: "120"
        run: python scripts/live_worker.py
