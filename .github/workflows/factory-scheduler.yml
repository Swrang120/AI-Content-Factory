name: AI Content Factory Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  trigger-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger production factory
        env:
          CRON_SECRET: ${{ secrets.ACF_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "ACF_CRON_SECRET GitHub Actions secret is not configured."
            exit 1
          fi

          response="$(
            curl --fail-with-body --silent --show-error               --max-time 240               -H "Authorization: Bearer ${CRON_SECRET}"               "https://ai-content-factory-zeta-ruby.vercel.app/api/cron/factory"
          )"

          echo "${response}"
