name: AI Content Factory - YouTube Live Worker

on:
  schedule:
    # 13:50 Asia/Kolkata (08:20 UTC): prepare for the 14:00–16:00 live window.
    - cron: "20 8 * * *"
  workflow_dispatch:

concurrency:
  group: acf-youtube-live-worker
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Claim live job and stream for two hours
        env:
          ACF_FACTORY_URL: ${{ secrets.ACF_FACTORY_URL }}
          LIVE_WORKER_TOKEN: ${{ secrets.LIVE_WORKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACF_FACTORY_URL:-}" || { echo "::error::Add ACF_FACTORY_URL in GitHub Actions secrets (the production Vercel base URL)."; exit 1; }
          test -n "${LIVE_WORKER_TOKEN:-}" || { echo "::error::Add LIVE_WORKER_TOKEN in GitHub Actions secrets. It must match the Vercel LIVE_WORKER_TOKEN."; exit 1; }
          BASE="${ACF_FACTORY_URL%/}"
          CLAIM=""
          # The Vercel live cron creates the broadcast at 13:55 IST. Wait for it.
          for attempt in $(seq 1 50); do
            CLAIM="$(curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer ${LIVE_WORKER_TOKEN}" \
              "${BASE}/api/live/worker/claim")"
            JOB="$(printf '%s' "$CLAIM" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("yes" if d.get("job") else "no")')"
            if [ "$JOB" = "yes" ]; then break; fi
            sleep 30
          done
          JOB_ID="$(printf '%s' "$CLAIM" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("job") or {}).get("id",""))')"
          if [ -z "$JOB_ID" ]; then
            echo "::error::No live job was claimable. Check liveAutomation, YouTube OAuth, live cron, and available media."
            printf '%s\n' "$CLAIM"
            exit 1
          fi
          export CLAIM BASE JOB_ID
          python3 - <<'PY'
          import json, os, datetime, time
          d=json.loads(os.environ["CLAIM"])["job"]
          start=datetime.datetime.fromisoformat(d["scheduledStartTime"].replace("Z","+00:00")).timestamp()
          wait=max(0,int(start-time.time()))
          print(f"Claimed live job {d.get('id')} — {d.get('title')}; waiting {wait}s for scheduled start.")
          time.sleep(wait)
          with open("live-job.json","w",encoding="utf-8") as f: json.dump(d,f)
          PY
          MEDIA_URL="$(python3 -c 'import json; print(json.load(open("live-job.json"))["mediaUrl"])')"
          MEDIA_TYPE="$(python3 -c 'import json; print(json.load(open("live-job.json")).get("mediaType","video"))')"
          RTMP_URL="$(python3 -c 'import json; j=json.load(open("live-job.json")); print(j["rtmpUrl"])')"
          test -n "$MEDIA_URL" || { echo "::error::Live job has no media URL."; exit 1; }
          test -n "$RTMP_URL" || { echo "::error::YouTube RTMP URL is missing."; exit 1; }
          if [ "$MEDIA_TYPE" = "audio" ]; then
            ffmpeg -hide_banner -loglevel warning \
              -re -f lavfi -i "color=c=0x101827:s=1920x1080:r=30" \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -i "$MEDIA_URL" \
              -t 7200 -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='AI CONTENT FACTORY LIVE':fontcolor=white:fontsize=54:x=(w-text_w)/2:y=h*0.40,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Original / authorized music':fontcolor=0xD8B45A:fontsize=34:x=(w-text_w)/2:y=h*0.50" \
              -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 30 -g 60 \
              -c:a aac -b:a 128k -ar 44100 -shortest -f flv "$RTMP_URL" &
          else
            ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i "$MEDIA_URL" \
              -t 7200 -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 30 -g 60 \
              -c:a aac -b:a 128k -ar 44100 -f flv "$RTMP_URL" &
          fi
          FFMPEG_PID=$!
          sleep 20
          if ! kill -0 "$FFMPEG_PID" 2>/dev/null; then
            wait "$FFMPEG_PID" || true
            curl --silent --show-error --max-time 30 -X POST \
              -H "Authorization: Bearer ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"id\":\"$JOB_ID\",\"error\":\"FFmpeg exited before stream startup\"}" \
              "${BASE}/api/live/worker/error" || true
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"id\":\"$JOB_ID\"}" "${BASE}/api/live/worker/start"
          set +e
          wait "$FFMPEG_PID"
          STREAM_EXIT=$?
          set -e
          if [ "$STREAM_EXIT" -ne 0 ]; then
            curl --silent --show-error --max-time 30 -X POST \
              -H "Authorization: Bearer ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"id\":\"$JOB_ID\",\"error\":\"FFmpeg stream exited with code $STREAM_EXIT\"}" \
              "${BASE}/api/live/worker/error" || true
            exit "$STREAM_EXIT"
          fi
          curl --fail-with-body --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer ${LIVE_WORKER_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"id\":\"$JOB_ID\"}" "${BASE}/api/live/worker/finish"
