name: Frontend and Backend Syntax Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check all root JavaScript files
        shell: bash
        run: |
          set -e
          for file in ./*.js; do
            [ -f "$file" ] || continue
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check server and Vercel entry syntax
        run: |
          node --check server.js
          node --check api/index.js
